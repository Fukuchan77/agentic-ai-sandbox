[project]
name = "langgraph-workflow-patterns"
version = "0.1.0"
description = "Lesson 06 のワークフローパターン（Chaining / Routing）を LangGraph のグラフ構造で書き直した独立トラック | Lesson 06 workflow patterns (Chaining / Routing) rewritten as explicit LangGraph graphs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # メジャーは固定・マイナー/パッチは更新可（caret 相当）/ pin major, allow minor & patch updates.
    # 明示的なグラフ（State + nodes + edges）を組み立てる本体 / the graph runtime.
    "langgraph>=1.2.6,<2",
    # メッセージ/モデル抽象 / message & model abstractions.
    "langchain-core>=1.4.8,<2",
    # anthropic プロバイダ / the Anthropic chat model.
    "langchain-anthropic>=1.4.8,<2",
    # ollama を OpenAI 互換エンドポイント（/v1）経由で叩く / reach Ollama via its OpenAI-compatible API.
    "langchain-openai>=1.3.3,<2",
    # ルート .env を型付きで読む（既存教材と同じ変数名）/ typed .env loading (same keys as the root bootcamp).
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lg_workflow_patterns"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 教材は lessons/NN-*/ に配置（各レッスンに README + コード + テスト）/
# the curriculum lives in lessons/NN-*/ (README + code + test per lesson).
testpaths = ["lessons"]
