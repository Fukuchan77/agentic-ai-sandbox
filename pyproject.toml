[project]
name = "agentic-ai-bootcamp"
version = "0.1.0"
description = "Pydantic AI で Agentic AI / AI agent 開発を基礎から応用まで学ぶハンズオン教材 | Hands-on bootcamp for building Agentic AI / AI agents with Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # pydantic-ai-slim with the extras the lessons actually use:
    #   anthropic → AnthropicModel/AnthropicProvider (default provider)
    #   openai    → OpenAI-compatible client used to reach a local Ollama daemon
    "pydantic-ai-slim[anthropic,openai]>=1.0",
    "pydantic-settings>=2.0",
    # Observability lesson (05). Optional at runtime — guarded by env.
    "logfire>=3.0",
    # Production lesson (10) — FastAPI + SSE.
    "fastapi>=0.115",
    "sse-starlette>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bootcamp_common"]

# uv ワークスペース / uv workspace.
# ルート（この Pydantic AI 教材）に加え、`frameworks/*` の各フレームワーク版を
# **独立したメンバーパッケージ**として束ねる。`uv sync` が全メンバーを 1 つの
# venv / 1 つの uv.lock に解決する。メンバーは相互依存もルート依存も持たない（完全独立）。
# In addition to the root (this Pydantic AI bootcamp), each framework rewrite under
# `frameworks/*` is an **independent member package**. `uv sync` resolves every member
# into a single venv / single uv.lock. Members depend on neither each other nor the root.
[tool.uv.workspace]
members = ["frameworks/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Beginner-friendly but tidy: errors, pyflakes, imports, bugbear, pyupgrade, simplify.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Discover tests inside each lesson directory as well as the top-level tests/.
testpaths = ["lessons", "tests"]
pythonpath = ["src"]
